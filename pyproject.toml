[project]
name = "miramode"
version = "1.2.0"
description = "Control Mira Mode digital showers and bath fillers over Bluetooth LE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ryan Shaw" },
]
keywords = ["mira", "mira-mode", "kohler", "shower", "bluetooth", "ble",
            "home-automation", "smart-home"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "bleak>=0.22",
]

[project.urls]
Homepage = "https://github.com/ryan-shaw/mira-mode-control"
Repository = "https://github.com/ryan-shaw/mira-mode-control"
Issues = "https://github.com/ryan-shaw/mira-mode-control/issues"

[project.scripts]
miramode = "miramode.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miramode"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

[tool.ty.environment]
python-version = "3.10"
