[project]
name = "mira-mode-control"
version = "1.0.0"
description = "A Python module and CLI to control Mira Mode digital showers and bath fillers over BLE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ryan Shaw" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "bleak>=0.22",
]

[project.urls]
Homepage = "https://github.com/ryan-shaw/mira-mode-control"

[project.scripts]
miramode = "miramode.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miramode"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

[tool.ty.environment]
python-version = "3.10"
