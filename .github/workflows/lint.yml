name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned to an exact release: setup-uv publishes no moving v9 major
      # tag, so `@v9` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml, so CI
      # checks the same versions that are pinned for everyone else.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version supported and the newest released, so a
        # break at either end of the range shows up here.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  ty:
    name: ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned to an exact release: setup-uv publishes no moving v9 major
      # tag, so `@v9` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ty
        run: uv run ty check --output-format=github
