; A battery powered button that starts a Mira Mode preset.
;
;   pio run --target upload
;   pio device monitor
;
[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; NimBLE rather than Bluedroid: a fraction of the flash and RAM, and it
; is the stack whose bonding behaviour this depends on. Pinned to 1.x
; because 2.x renamed much of the API used here.
lib_deps = h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    ; Quieten the stack; the sketch prints what matters over serial.
    -DCORE_DEBUG_LEVEL=0
    ; Bonds live in NVS and must outlive deep sleep, so keep the default
    ; NVS partition rather than trimming it away.
    -DCONFIG_BT_NIMBLE_NVS_PERSIST=1
